<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — QuizArena</title>
  <meta name="description" content="Join QuizArena for free. Compete in live quiz events, win real cash prizes, and withdraw via bKash, Nagad, or Rocket.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{navy:'#101B3D',indigo:{DEFAULT:'#3E4BF0',50:'#EEF0FE',100:'#DDE0FD'},green:'#17B26A',coral:'#F0483E',gold:'#F5A623',paper:'#F7F8FC',slate:'#5B6478',line:'#E4E7F0'}}}}</script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body style="background:var(--paper);min-height:100vh;display:flex;flex-direction:column">

<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:480px">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:28px">
      <a href="index.html" style="font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--ink-navy);text-decoration:none;display:inline-flex;align-items:center;gap:8px">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" stroke="#3E4BF0" stroke-width="2"/><path d="M8 14l4 4 8-8" stroke="#3E4BF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Quiz<span style="color:var(--signal-indigo)">Arena</span>
      </a>
      <h1 style="font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--ink-navy);margin-top:18px;margin-bottom:6px">Create your account</h1>
      <p style="font-size:14px;color:var(--slate)">Free to join — start competing in minutes</p>
    </div>

    <!-- Registration Form -->
    <div class="card" style="padding:28px">
      <form id="register-form" x-data="{
        loading:false,
        showPass:false,
        step:1,
        name:'',
        email:'',
        phone:'',
        password:'',
        referral:'',
        agree:false,
        get canContinue(){ return this.name && this.email && this.phone }
      }" @submit.prevent="if(step===1){step=2}else{loading=true;setTimeout(()=>{window.location='users/dashboard.html'},1500)}">

        <!-- Step 1: Basic Info -->
        <div x-show="step===1">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:20px">
            <div style="height:3px;flex:1;background:var(--signal-indigo);border-radius:2px"></div>
            <div style="height:3px;flex:1;background:var(--line);border-radius:2px"></div>
            <span style="font-size:11px;color:var(--slate);font-weight:600">Step 1 of 2</span>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="form-group" style="margin-bottom:16px;grid-column:span 2">
              <label class="form-label" for="reg-name">Full Name</label>
              <div class="form-input-icon-wrap">
                <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <input id="reg-name" type="text" class="form-input" placeholder="Your full name" x-model="name" required>
              </div>
            </div>

            <div class="form-group" style="margin-bottom:16px">
              <label class="form-label" for="reg-email">Email Address</label>
              <div class="form-input-icon-wrap">
                <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <input id="reg-email" type="email" class="form-input" placeholder="you@example.com" x-model="email" required>
              </div>
            </div>

            <div class="form-group" style="margin-bottom:16px">
              <label class="form-label" for="reg-phone">Phone Number</label>
              <div class="form-input-icon-wrap">
                <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <input id="reg-phone" type="tel" class="form-input" placeholder="01XXXXXXXXX" x-model="phone" required>
              </div>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:20px">
            <label class="form-label" for="reg-referral">Referral Code <span style="color:var(--slate);font-weight:400">(optional)</span></label>
            <div class="form-input-icon-wrap">
              <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              <input id="reg-referral" type="text" class="form-input" placeholder="Friend's referral code" x-model="referral">
            </div>
            <div class="form-hint">Enter a referral code to give your friend a bonus and earn ৳10 on your first paid event</div>
          </div>

          <button type="button" @click="if(canContinue)step=2" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:15px" :class="{'opacity-50 cursor-not-allowed':!canContinue}">
            Continue →
          </button>
        </div>

        <!-- Step 2: Password & Agreement -->
        <div x-show="step===2" style="display:none">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:20px">
            <div style="height:3px;flex:1;background:var(--signal-indigo);border-radius:2px"></div>
            <div style="height:3px;flex:1;background:var(--signal-indigo);border-radius:2px"></div>
            <span style="font-size:11px;color:var(--slate);font-weight:600">Step 2 of 2</span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="reg-password">Create Password</label>
            <div class="form-input-icon-wrap" style="position:relative">
              <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input id="reg-password" :type="showPass ? 'text' : 'password'" class="form-input" placeholder="At least 8 characters" x-model="password" required style="padding-right:44px">
              <button type="button" @click="showPass=!showPass" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--slate)">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
            <!-- Password strength -->
            <div style="margin-top:8px">
              <div class="progress-bar" style="height:4px">
                <div class="progress-fill" :class="password.length>=8?'green':(password.length>=4?'gold':'coral')" :style="{width: Math.min(password.length/12*100,100)+'%'}"></div>
              </div>
              <div style="font-size:11px;margin-top:4px" :class="password.length>=8?'text-green':(password.length>=4?'text-gold':'text-slate')">
                <span x-text="password.length>=8?'Strong password ✓':(password.length>=4?'Getting there...':'Use 8+ characters')">Use 8+ characters</span>
              </div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="form-input-icon-wrap">
              <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input id="reg-confirm-password" type="password" class="form-input" placeholder="Repeat your password" required>
            </div>
          </div>

          <!-- Terms checkbox -->
          <div style="margin-bottom:20px">
            <label class="form-check" style="align-items:flex-start">
              <input type="checkbox" id="reg-agree" x-model="agree" required>
              <span class="form-check-label">
                I agree to QuizArena's
                <a href="terms.html" style="color:var(--signal-indigo);font-weight:600;text-decoration:none">Terms of Service</a> and
                <a href="privacy-policy.html" style="color:var(--signal-indigo);font-weight:600;text-decoration:none">Privacy Policy</a>.
                I understand this platform involves real money transactions.
              </span>
            </label>
          </div>

          <div style="display:flex;gap:10px">
            <button type="button" @click="step=1" class="btn btn-ghost" style="flex-shrink:0">← Back</button>
            <button type="submit" id="register-submit" class="btn btn-primary" style="flex:1;justify-content:center;padding:13px;font-size:15px" :class="{'opacity-70':loading}" :disabled="loading||!agree">
              <span x-show="!loading">Create Account</span>
              <span x-show="loading" style="display:flex;align-items:center;justify-content:center;gap:8px">
                <svg width="18" height="18" viewBox="0 0 38 38" stroke="currentColor" style="animation:spin 0.7s linear infinite"><g fill="none"><g transform="translate(1 1)" stroke-width="2.5"><circle stroke-opacity=".3" cx="18" cy="18" r="18"/><path d="M36 18c0-9.94-8.06-18-18-18"/></g></g></svg>
              </span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Perks -->
    <div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div style="background:var(--surface-white);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:16px;margin-bottom:4px">🎯</div>
        <div style="font-size:11px;font-weight:600;color:var(--ink-navy)">Fair Rankings</div>
      </div>
      <div style="background:var(--surface-white);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:16px;margin-bottom:4px">💸</div>
        <div style="font-size:11px;font-weight:600;color:var(--ink-navy)">Real Prizes</div>
      </div>
      <div style="background:var(--surface-white);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:16px;margin-bottom:4px">⚡</div>
        <div style="font-size:11px;font-weight:600;color:var(--ink-navy)">Instant Wallet</div>
      </div>
    </div>

    <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--slate)">
      Already have an account?
      <a href="login.html" style="color:var(--signal-indigo);font-weight:700;text-decoration:none">Log in →</a>
    </p>
  </div>
</div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<div id="toast-container" class="toast-container"></div>
<script src="assets/js/main.js"></script>
</body>
</html>
